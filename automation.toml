prompt = "Every day at 9:00 PM Asia/Calcutta time, create a concise PDF briefing from new inbox emails sent by Superhuman, The Rundown Tech, and The Rundown AI.\n\nWorkflow requirements:\n1. Use the connected Gmail account and search only a bounded recent window for efficiency: fetch inbox emails from the last 48 hours from these senders, then sort by message timestamp and keep only messages whose timestamp falls within the last 24 hours from the run start time. This avoids timezone edge cases while staying token-efficient.\n2. For the initial fetch, use lightweight listing first. Only hydrate full message content for messages that appear relevant and only when the preview/snippet is too short for a good summary.\n3. If no qualifying emails are found, generate a clean PDF titled for the day that states there were no matching new emails in the last 24 hours, then upload it to Google Drive folder ID `1jNK2aGo6Cpy_iiKzaVXNLAmGJIUWSfFd`.\n4. Extract the meaningful editorial content only. Remove ads, sponsor blocks, referral links, unsubscribe/promotional filler, repeated headings, repeated footer text, and low-value boilerplate.\n5. Merge overlapping items across newsletters when they cover the same topic. Deduplicate by normalized topic, not just by identical wording.\n6. For each retained topic, do browser/web research for 1-3 extra factual context points. Prefer original sources or reputable coverage. Do not invent missing details.\n7. Keep the PDF simple. Use only the title/date plus one heading per actual topic, then concise bullets under that heading. Do not include extra sections such as Most Important Updates, Quick 30-Second Read, Things Worth Exploring Later, category headings, or Sources.\n8. Under each topic heading, write concise bullet points with only the highest-value information. Prefer short bullets over paragraphs.\n9. Produce a professionally formatted PDF with:\n- title: AI & Tech Summary\n- date of run in Asia/Calcutta\n- topic headings only\n- compact bullet lists\n- clickable links\n- clean modern layout with good spacing\n10. Save the PDF with filename `AI_Tech_Summary_YYYY-MM-DD.pdf`, where the date uses the Asia/Calcutta run date.\n11. Upload the PDF to Google Drive folder ID `1jNK2aGo6Cpy_iiKzaVXNLAmGJIUWSfFd`.\n12. If a file with the same name already exists in that folder for the same date, update/replace it instead of creating duplicates.\n\nError handling requirements:\n- If one sender has no new email, continue with the others.\n- If the same email appears more than once or multiple issues cover the same story, keep one merged summary item.\n- If PDF generation fails on the first attempt, retry once with a simpler but still professional layout.\n- If Google Drive upload fails, retry once. If replacement fails, upload as a new file with suffix `_retry1`.\n- At the end, report the outcome clearly, including email counts processed, topics used, output filename, and Drive upload status.\n\nQuality bar:\n- Be conservative and factual.\n- Do not invent missing details.\n- Keep the output compact and useful enough to read in under 3 minutes.\n- Optimize for reliability and low token usage over stylistic flourish."
